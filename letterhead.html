<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solunar Energy Letterhead</title>
<style>
  @page {
    size: A4;
    margin: 0;
  }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #2B2B2B;
    margin: 0;
    padding: 0;
    background-color: #ffffff;
  }
  .letterhead-container {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    box-sizing: border-box;
    position: relative;
    padding: 40px 50px 120px 50px;
  }
  
  /* Top Accent Bar */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #1D3B66 70%, #E5A93C 100%);
  }

  /* Header Layout */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 18px;
    border-bottom: 1.5px solid #E0E0E0;
    margin-top: 10px;
  }
  .logo-container img {
    height: 52px;
  }
  .header-tagline {
    text-align: right;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #1D3B66;
    text-transform: uppercase;
  }
  .header-tagline span {
    color: #C89228;
    display: block;
    font-size: 9.5px;
    margin-top: 3px;
    font-weight: 500;
  }

  /* Document Content Placeholder */
  .content {
    margin-top: 35px;
    font-size: 13px;
    line-height: 1.6;
    color: #333333;
  }
  .doc-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
    font-size: 11.5px;
    color: #666666;
  }

  /* Footer Layout */
  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 50px 24px 50px;
    background-color: #FAFAFA;
    border-top: 2px solid #E5A93C;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 10px;
    color: #1D3B66;
  }
  .footer-row-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
  }
  .footer-address {
    text-align: center;
    font-size: 9.5px;
    color: #555555;
    border-top: 1px solid #EAEAEA;
    padding-top: 6px;
  }
  .bottom-strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 8px;
    background-color: #1D3B66;
  }
</style>
</head>
<body>

<div class="letterhead-container">
  <div class="top-bar"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="logo-container">
      <img src="public/logo-quotation.png" alt="Solunar Energy">
    </div>
    <div class="header-tagline">
      Solunar Energy Pakistan
      <span>Trusted Solar Partner</span>
    </div>
  </div>

  <!-- DOCUMENT CONTENT AREA -->
  <div class="content">
    <div class="doc-meta">
      <div><strong>DATE:</strong> </div>
    </div>

    <p><strong>TO WHOM IT MAY CONCERN,</strong></p>
    
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-row-main">
      <div>📞 +92 325 0200632</div>
      <div>✉ info@solunarenergy.pk</div>
      <div>🌐 solunarenergy.pk</div>
    </div>
    <div class="footer-address">
      📍 176-E, Khayaban-e-Amin, Lahore, Pakistan
    </div>
  </div>
  <div class="bottom-strip"></div>
</div>

</body>
</html>
